<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Lembretes</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Botão fixo no canto da página para alternar entre modo claro e escuro -->
  <button id="btn-tema" aria-label="Alternar entre modo claro e escuro" title="Alternar tema">🌙</button>

  <!-- Bloco fixo no canto mostrando o total somado dos preços dos lembretes -->
  <div id="total-preco" class="total-preco">💰 Total: R$ 0,00</div>

  <main class="container">
    <h1>📌 Meus Lembretes</h1>

    <!-- Formulário de Entrada -->
    <div class="card-inputs">
      <div class="form-group">
        <label for="input-texto">Descrição do Lembrete:</label>
        <input type="text" id="input-texto" placeholder="Ex: Comprar leite no mercado...">
      </div>

      <div class="form-group">
        <label for="select-prioridade">Prioridade:</label>
        <select id="select-prioridade">
          <option value="baixa">Baixa</option>
          <option value="media">Média</option>
          <option value="alta">Alta</option>
        </select>
      </div>

      <div class="form-group">
        <label for="input-vencimento">Data de Vencimento (opcional):</label>
        <input type="date" id="input-vencimento">
      </div>

      <div class="form-group">
        <label for="input-preco">Preço (opcional):</label>
        <input type="number" id="input-preco" placeholder="Ex: 15,90" min="0" step="0.01" inputmode="decimal">
      </div>

      <button id="btn-adicionar">Adicionar Lembrete</button>
      <p id="msg-erro" class="erro"></p>
    </div>

    <!-- Filtros de busca e refinamento da lista -->
    <div class="card-filtros">
      <div class="form-group">
        <label for="input-busca">Pesquisar lembrete:</label>
        <input type="text" id="input-busca" placeholder="Ex: FLOCOS...">
      </div>

      <div class="filtros-grid">
        <div class="form-group">
          <label for="filtro-status">Status:</label>
          <select id="filtro-status">
            <option value="todos">Todos</option>
            <option value="pendente">Pendentes</option>
            <option value="concluido">Concluídos</option>
          </select>
        </div>

        <div class="form-group">
          <label for="filtro-prioridade">Prioridade:</label>
          <select id="filtro-prioridade">
            <option value="todas">Todas</option>
            <option value="alta">Alta</option>
            <option value="media">Média</option>
            <option value="baixa">Baixa</option>
          </select>
        </div>

        <div class="form-group">
          <label for="filtro-vencimento">Vencimento:</label>
          <select id="filtro-vencimento">
            <option value="todas">Todas</option>
            <option value="atrasados">Atrasados</option>
            <option value="hoje">Vence hoje</option>
            <option value="semana">Próximos 7 dias</option>
            <option value="sem-data">Sem data</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Container onde os cards serão gerados dinamicamente -->
    <section id="lista-lembretes" class="grid-lembretes"></section>
    <p id="msg-vazio" class="msg-vazio oculto">Nenhum lembrete encontrado com esses filtros.</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
